name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Bump version
        id: bump
        run: node .github/scripts/bump-version.mjs

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md scripts templates styles lang

      - name: Commit version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.bump.outputs.version }}" module.json module.zip
          --title "v${{ steps.bump.outputs.version }}" --generate-notes
